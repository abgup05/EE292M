[project]
name = "evidence-desk"
version = "0.2.0"
description = "EE292M capstone: tests an equity thesis against SEC filings with verified quotes"
requires-python = ">=3.14,<3.15"
# Each dependency and why it earns its place:
#   fastapi/uvicorn  - the established API stack in this repository
#   httpx            - EDGAR and public-page retrieval: streamed bodies with size caps,
#                      timeouts and per-hop redirect control
#   beautifulsoup4   - tolerant HTML parsing of inline-XBRL filings and public pages
#   anthropic        - the optional model engine (planning, assessment, summary)
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "anthropic>=0.40,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.10,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
