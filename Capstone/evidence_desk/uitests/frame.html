<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frame check</title>
<style>iframe { border: 0; display: block; }</style>
</head>
<body>
<!--
  The frame check. `make uitest` loads this file in headless Chromium, with the same-origin rule
  off for this page only (KEYS_FLAGS in the Makefile), and dumps its DOM. It loads the page in a
  frame of a given size (a frame's own size is its viewport, so the page lays itself out for
  1440x900, 900x800 and 360x740), selects claims, switches tabs and picks items the way a reader
  would, and writes what it measured after each step into the list below;
  uitests/test_frame_dom.py judges it. It decides nothing itself: every step records what the
  page did. The measures are the browser's own (scroll sizes, client sizes, bounding boxes).
-->
<ol id="steps"></ol>
<p id="done" data-done="false">running</p>
<script>
"use strict";
const steps = document.getElementById("steps");
const done = document.getElementById("done");
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

async function until(test, what) {
  for (let i = 0; i < 100; i += 1) {
    if (test()) return;
    await sleep(50);
  }
  throw new Error(`timed out waiting for ${what}`);
}

/** Load the page at `url` in a new frame of the given size and wait until `ready(doc)` holds. */
async function open(url, width, height, ready, what) {
  document.querySelector("iframe")?.remove();
  const frame = document.createElement("iframe");
  frame.title = "Evidence Desk";
  frame.width = String(width);
  frame.height = String(height);
  frame.src = `http://app:8000/${url}`;
  document.body.prepend(frame);
  await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  await until(() => ready(frame.contentDocument), what);
  await sleep(150);
  return frame;
}

const runReady = (doc) => {
  const view = doc.getElementById("run-view");
  return Boolean(view && !view.hidden && doc.querySelector("#scorecard li[data-claim-id]") && doc.querySelector('#tabs [role="tab"]'));
};

function text(node) {
  return node ? node.textContent.replace(/\s+/g, " ").trim() : "";
}

function visible(node) {
  if (!node || !node.isConnected) return false;
  const box = node.getBoundingClientRect();
  return box.width > 0 && box.height > 0 && node.ownerDocument.defaultView.getComputedStyle(node).visibility !== "hidden";
}

/** Whether a node can be reached: drawn, not inside anything inert, and not in a hidden part. */
function reachable(node) {
  return visible(node) && !node.closest("[inert]") && !node.closest(".is-off");
}

function press(win, target, key) {
  target.dispatchEvent(new win.KeyboardEvent("keydown", { key, bubbles: true, cancelable: true }));
}

/** What the frame looks like now: the page's and each pane's scroll, the selection, the tab, what is on show. */
function record(frame, step, extra) {
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  const root = doc.documentElement;
  const li = document.createElement("li");
  const pane = (id) => {
    const node = doc.getElementById(id);
    if (!node || !visible(node)) return "none";
    const box = node.getBoundingClientRect();
    return JSON.stringify({ left: Math.round(box.left), top: Math.round(box.top), width: Math.round(box.width), height: Math.round(box.height), scrollHeight: node.scrollHeight, clientHeight: node.clientHeight, overflowY: win.getComputedStyle(node).overflowY });
  };
  const focusable = [...doc.querySelectorAll('a[href], button, input, select, textarea, summary, [tabindex]:not([tabindex="-1"])')].filter((node) => !node.disabled);
  const dockets = [...doc.querySelectorAll("#claim-list details.claim")];
  li.dataset.step = step;
  li.dataset.viewport = `${win.innerWidth}x${win.innerHeight}`;
  // The page itself: it scrolls when its content is taller or wider than the window.
  li.dataset.pageScrollHeight = String(Math.max(root.scrollHeight, doc.body.scrollHeight));
  li.dataset.pageScrollWidth = String(Math.max(root.scrollWidth, doc.body.scrollWidth));
  li.dataset.pageClientHeight = String(root.clientHeight);
  li.dataset.pageClientWidth = String(root.clientWidth);
  li.dataset.rail = pane("rail");
  li.dataset.centre = pane("centre-scroll");
  li.dataset.inspector = pane("inspector");
  li.dataset.strip = pane("status-banner");
  li.dataset.tabs = pane("tabs");
  li.dataset.barHeight = String(Math.round(doc.querySelector(".cmdbar").getBoundingClientRect().height));
  li.dataset.barRight = String(Math.round(Math.max(...[...doc.querySelectorAll(".cmdbar > *, .cmd-tools > *")].filter(visible).map((node) => node.getBoundingClientRect().right))));
  li.dataset.tabsPosition = doc.getElementById("tabs") ? win.getComputedStyle(doc.getElementById("tabs")).position : "";
  li.dataset.selected = (doc.querySelector('#rail [data-select][aria-current="true"]') || { dataset: { select: "none" } }).dataset.select;
  li.dataset.tab = doc.getElementById("workspace").dataset.tab || "";
  li.dataset.tabSelected = [...doc.querySelectorAll('#tabs [role="tab"][aria-selected="true"]')].map((tab) => tab.dataset.tab).join(" ");
  li.dataset.tabNames = [...doc.querySelectorAll('#tabs [role="tab"]')].map((tab) => text(tab.querySelector(".tab-label"))).join("|");
  li.dataset.panelsShown = [...doc.querySelectorAll("#centre-scroll .tabpanel")].filter(visible).map((panel) => panel.id).join(" ");
  li.dataset.selTitle = text(doc.getElementById("sel-title"));
  // The claims, listed once: every claim's text that is drawn anywhere on the page, and where.
  li.dataset.claimRows = [...doc.querySelectorAll("#scorecard li[data-claim-id]")].filter(visible).map((row) => row.dataset.claimId).join(" ");
  li.dataset.docketsDrawn = dockets.filter(visible).map((d) => d.dataset.docket).join(" ");
  li.dataset.docketsInert = dockets.filter((d) => d.hasAttribute("inert")).map((d) => d.dataset.docket).join(" ");
  li.dataset.docketHeadingsDrawn = String(dockets.filter((d) => visible(d.querySelector("summary"))).length);
  li.dataset.lanesDrawn = [...doc.querySelectorAll("#tot [data-tot-claim]")].filter(visible).map((lane) => lane.dataset.totClaim).join(" ");
  // How many times each claim's own words are drawn, anywhere on the page: every text node that is exactly the claim.
  const claimTexts = {};
  for (const row of doc.querySelectorAll("#scorecard li[data-claim-id]")) claimTexts[row.dataset.claimId] = text(row.querySelector(".score-claim"));
  const drawn = {};
  const walker = doc.createTreeWalker(doc.body, win.NodeFilter.SHOW_TEXT);
  for (let node = walker.nextNode(); node; node = walker.nextNode()) {
    const value = node.nodeValue.replace(/\s+/g, " ").trim();
    for (const [id, claim] of Object.entries(claimTexts)) if (value === claim && visible(node.parentElement)) drawn[id] = (drawn[id] || 0) + 1;
  }
  li.dataset.claimTextsDrawn = JSON.stringify(drawn);
  // Nothing in a hidden part may take the focus: every focusable node inside an off part or an inert one.
  li.dataset.focusableInHiddenParts = String(focusable.filter((node) => node.closest(".is-off") && !node.closest("[inert]")).length);
  li.dataset.focusableDrawnButInert = String(focusable.filter((node) => visible(node) && node.closest("[inert]")).length);
  li.dataset.tabOrderDockets = [...new Set(focusable.filter(reachable).map((node) => node.closest("details.claim")).filter(Boolean).map((d) => d.dataset.docket))].join(" ");
  li.dataset.inspecting = doc.getElementById("inspector").dataset.inspecting || "";
  li.dataset.inspectorText = visible(doc.getElementById("inspect-body")) ? text(doc.getElementById("inspect-body")).slice(0, 4000) : "";
  li.dataset.picked = [...doc.querySelectorAll("#centre-scroll .is-picked")].filter(visible).map((node) => node.dataset.pick).join(" ");
  li.dataset.active = doc.activeElement ? doc.activeElement.id || doc.activeElement.tagName.toLowerCase() : "";
  Object.assign(li.dataset, extra || {});
  li.textContent = step;
  steps.append(li);
}

async function run() {
  // ---- a wide window: 1440x900, the live three-reader run
  let frame = await open("?sample=run-live&theme=paper", 1440, 900, runReady, "the live run at 1440x900");
  let doc = frame.contentDocument;
  let win = frame.contentWindow;
  record(frame, "wide-loaded", { firstScreen: String(doc.body.classList.contains("is-first")), howtoIn: doc.getElementById("howto").parentElement.id });

  // Select the second claim by its row in the rail.
  doc.querySelector('#scorecard a.score-row[data-select="c2"]').click();
  await sleep(100);
  record(frame, "wide-c2");

  // Its Evidence tab, by the tab's own button.
  doc.getElementById("tab-evidence").click();
  await sleep(100);
  const finding = [...doc.querySelectorAll("#claim-list details.claim:not(.is-off) article.finding[data-pick]")].find(visible);
  record(frame, "wide-c2-evidence", { firstFinding: finding ? finding.dataset.findingId : "", contextDrawnInCentre: String([...doc.querySelectorAll("#centre-scroll .excerpt .context")].filter(visible).length) });

  // Pick its last finding by the finding's own button: the inspector reads its quote in context.
  const findings = [...doc.querySelectorAll("#claim-list details.claim:not(.is-off) article.finding[data-pick]")].filter(visible);
  const last = findings[findings.length - 1];
  last.querySelector("[data-pick-button]").click();
  await sleep(100);
  record(frame, "wide-c2-pick-finding", {
    pickedFinding: last.dataset.findingId,
    inspectedEvidence: [...doc.querySelectorAll("#inspect-body [data-inspected-evidence]")].map((node) => node.dataset.inspectedEvidence).join(" "),
    inspectedContext: String([...doc.querySelectorAll("#inspect-body .excerpt .context")].filter(visible).length),
    inspectedLinks: [...doc.querySelectorAll("#inspect-body .evidence-caption a.ext")].map((a) => a.getAttribute("href")).join(" "),
  });

  // Its Overview tab: the computed test's operands and arithmetic are read in the inspector.
  press(win, doc.body, "1");
  await sleep(100);
  doc.querySelector("#claim-list details.claim:not(.is-off) .ct [data-pick-button]").click();
  await sleep(100);
  record(frame, "wide-c2-pick-test", {
    inspectedOperands: [...doc.querySelectorAll("#inspect-body [data-operand]")].map((row) => row.dataset.operand).join("|"),
    detailDrawnInCentre: String([...doc.querySelectorAll("#centre-scroll .ct-detail")].filter(visible).length),
  });

  // A claim whose test has a long note on a value (c4): the operand's term stays on its line and nothing spills out of the inspector.
  doc.querySelector('#scorecard a.score-row[data-select="c4"]').click();
  await sleep(150);
  const insBody = doc.getElementById("inspect-body");
  record(frame, "wide-c4", {
    inspectorSpill: String(insBody.scrollWidth - insBody.clientWidth),
    tallestTerm: String(Math.max(0, ...[...insBody.querySelectorAll("[data-operand] th code")].map((node) => Math.round(node.getBoundingClientRect().height)))),
    widestNote: String(Math.max(0, ...[...insBody.querySelectorAll("[data-operand] .ct-label")].map((node) => Math.round(node.getBoundingClientRect().width)))),
  });
  doc.querySelector('#scorecard a.score-row[data-select="c2"]').click();
  await sleep(100);

  // The Events tab reads the newest 8-K at the side; picking another reads that one.
  press(win, doc.body, "4");
  await sleep(100);
  record(frame, "wide-events", { firstEvent: (doc.querySelector("#events li.event") || { dataset: {} }).dataset.eventId || "" });
  const events = [...doc.querySelectorAll("#events li.event")];
  events[1].querySelector("[data-pick-button]").click();
  await sleep(100);
  record(frame, "wide-pick-event", { pickedEvent: events[1].dataset.eventId, inspectedEvent: (doc.querySelector("#inspect-body [data-inspected-event]") || { dataset: {} }).dataset.inspectedEvent || "", openingsDrawnInCentre: String([...doc.querySelectorAll("#centre-scroll .event-opening")].filter(visible).length) });

  // The Figures tab: selecting a row reads its inputs at the side, and the row does not open in place.
  press(win, doc.body, "5");
  await sleep(100);
  const rows = [...doc.querySelectorAll("#figures details.fig-row")];
  rows[3].querySelector("summary").click();
  await sleep(100);
  record(frame, "wide-pick-figure", { pickedFigure: rows[3].dataset.metricId, rowOpen: String(rows[3].open), inspectedLabel: text(doc.querySelector("#inspect-body .ins-figure-label")), inspectedValue: text(doc.querySelector("#inspect-body .ins-figure-value")) });

  // Over time for one claim: its own lane only. Then the whole thesis: every lane.
  press(win, doc.body, "3");
  await sleep(150);
  record(frame, "wide-c2-time");
  doc.getElementById("rail-thesis").click();
  await sleep(150);
  record(frame, "wide-thesis-time");

  // Limits has nothing to read at the side: the centre pane takes the inspector's width.
  press(win, doc.body, "6");
  await sleep(100);
  record(frame, "wide-thesis-limits");

  // The status line's full counts open over the panes, and the Run drawer from the chip.
  doc.querySelector("#status-banner details.banner-fold > summary").click();
  await sleep(100);
  record(frame, "wide-counts-open", { countsOpen: String(doc.querySelector("#status-banner details.banner-fold").open) });
  doc.querySelector("#status-banner details.banner-fold > summary").click();
  doc.getElementById("run-button").click();
  await sleep(300);
  const drawer = doc.getElementById("run-drawer");
  record(frame, "wide-run-drawer", { drawerOpen: String(doc.body.classList.contains("run-drawer-open")), drawerInert: String(drawer.hasAttribute("inert")), drawerText: text(doc.getElementById("run-head")).slice(0, 3000), legendIn: doc.getElementById("legend").parentElement.id, howtoIn: doc.getElementById("howto").parentElement.id });
  doc.getElementById("run-drawer-close").click();

  // ---- a claim and a tab named in the address
  frame = await open("?sample=run-live&theme=terminal&claim=c3&tab=evidence", 1440, 900, runReady, "the live run opened on c3's evidence");
  record(frame, "wide-address", { theme: frame.contentDocument.documentElement.getAttribute("data-theme") });

  // ---- 1280x800, the smallest laptop the frame is drawn for
  frame = await open("?sample=run-live&theme=terminal&claim=c1", 1280, 800, runReady, "the live run at 1280x800");
  record(frame, "laptop-c1");

  // ---- the first screen at 1440x900: the form, the guide as the lead, the samples
  frame = await open("?theme=paper", 1440, 900, (d) => d.body.classList.contains("is-first") && d.getElementById("howto").parentElement.id === "lead-slot", "the first screen");
  doc = frame.contentDocument;
  record(frame, "wide-first", { firstScreen: String(doc.body.classList.contains("is-first")), howtoIn: doc.getElementById("howto").parentElement.id, samplesDrawn: String([...doc.querySelectorAll("#sample-nav a")].filter(visible).length), formDrawn: String(visible(doc.getElementById("decision"))) });

  // ---- a narrower window: the rail is a strip, the inspector a sheet
  frame = await open("?sample=run-live&theme=paper&claim=c2&tab=evidence", 900, 800, runReady, "the live run at 900x800");
  doc = frame.contentDocument;
  record(frame, "mid-c2-evidence");
  [...doc.querySelectorAll("#claim-list details.claim:not(.is-off) article.finding[data-pick]")].filter(visible)[0].querySelector("[data-pick-button]").click();
  await sleep(100);
  record(frame, "mid-pick", { sheetPosition: frame.contentWindow.getComputedStyle(doc.getElementById("inspector")).position });
  press(frame.contentWindow, doc.activeElement, "Escape");
  await sleep(100);
  record(frame, "mid-escape");

  // ---- a phone: one column, the tabs stay in view, nothing scrolls sideways
  frame = await open("?sample=run-live&theme=paper", 360, 740, runReady, "the live run at 360x740");
  doc = frame.contentDocument;
  win = frame.contentWindow;
  record(frame, "phone-loaded");
  doc.querySelector('#scorecard a.score-row[data-select="c2"]').click();
  await sleep(200);
  doc.getElementById("tab-evidence").click();
  await sleep(100);
  record(frame, "phone-c2-evidence", { contextDrawn: String([...doc.querySelectorAll("#claim-list .excerpt .context")].filter(visible).length), pickButtonsDrawn: String([...doc.querySelectorAll("[data-pick-button]")].filter(visible).length) });
  win.scrollTo(0, 99999);
  await sleep(100);
  record(frame, "phone-scrolled", { scrollY: String(Math.round(win.scrollY)), tabsTop: String(Math.round(doc.getElementById("tabs").getBoundingClientRect().top)) });
  for (const [tab, name] of [["overview", "phone-c2-overview"], ["time", "phone-c2-time"], ["events", "phone-events"], ["figures", "phone-figures"], ["limits", "phone-limits"]]) {
    doc.getElementById(`tab-${tab}`).click();
    await sleep(120);
    record(frame, name);
  }
  frame = await open("?sample=run-live&theme=terminal", 360, 740, runReady, "the live run at 360x740, Terminal");
  record(frame, "phone-terminal");
  frame = await open("?theme=paper", 360, 740, (d) => d.body.classList.contains("is-first") && d.getElementById("howto").parentElement.id === "lead-slot", "the first screen at 360x740");
  record(frame, "phone-first");
  frame = await open("?sample=inbox&theme=paper", 360, 740, (d) => !d.getElementById("inbox-view").hidden && d.querySelector("#inbox-items article"), "the recorded inbox at 360x740");
  record(frame, "phone-inbox");
  frame = await open("?sample=inbox&theme=paper", 1440, 900, (d) => !d.getElementById("inbox-view").hidden && d.querySelector("#inbox-items article"), "the recorded inbox at 1440x900");
  doc = frame.contentDocument;
  const panel = doc.getElementById("result-panel");
  record(frame, "wide-inbox", { panelScrolls: String(panel.scrollHeight > panel.clientHeight), panelOverflowY: frame.contentWindow.getComputedStyle(panel).overflowY });
  // The widest bar there is: the recorded inbox in Terminal (mono), with the watch's health in it, on a laptop.
  frame = await open("?sample=inbox&theme=terminal", 1280, 800, (d) => !d.getElementById("inbox-view").hidden && d.querySelector("#inbox-items article") && !d.getElementById("watch-health").hidden, "the recorded inbox at 1280x800, Terminal");
  record(frame, "laptop-inbox-terminal");

  done.dataset.done = "true";
  done.textContent = "done";
}

run().catch((error) => {
  done.textContent = `the frame check stopped: ${error.message}`;
});
</script>
</body>
</html>
