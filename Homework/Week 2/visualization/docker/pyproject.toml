[project]
name = "radius-dependency-explorer"
version = "0.1.0"
description = "EE292M Week 2 sector dependency visualization"
requires-python = ">=3.14,<3.15"
# fastapi, openpyxl and uvicorn are this app's own. The website also runs every tagged version
# of the capstone live from vendored/ (docs/site-live.md at the repository root), so the one
# function needs the capstone's runtime dependencies too: httpx (EDGAR and its seed),
# beautifulsoup4 (filing HTML) and anthropic (the optional model engine). Every version
# 1 to 14 locks the same versions of these; the constraints below hold this lock to them.
dependencies = [
    "fastapi>=0.115,<1",
    "openpyxl>=3.1,<4",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "anthropic>=0.40,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.10,<1",
]

[tool.uv]
# The capstone's lock (Capstone/evidence_desk/docker/uv.lock, the same at every tag 1 to 14).
constraint-dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anthropic==0.125.0",
    "anyio==4.15.1",
    "beautifulsoup4==4.15.0",
    "certifi==2026.10.19",
    "click==8.5.0",
    "distro==1.9.0",
    "docstring-parser==0.18.0",
    "fastapi==0.159.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.20",
    "jiter==0.17.0",
    "opentelemetry-api==1.45.1",
    "pydantic==2.14.1",
    "pydantic-core==2.50.1",
    "sniffio==1.3.1",
    "soupsieve==3.0.4",
    "starlette==1.9.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uvicorn==0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
