# make site-secrets: a throwaway container that copies ANTHROPIC_API_KEY and SEC_USER_AGENT from
# the capstone's gitignored .env into the Vercel project's environment variables. The values
# reach the container through env_file and are never printed; the saved Vercel CLI login is
# mounted read-only.
services:
  secrets:
    image: node:22-alpine
    env_file:
      - ../../Capstone/evidence_desk/.env
    environment:
      MODE: ${MODE:-check}
      REDEPLOY: ${REDEPLOY:-}
      VERCEL_PROJECT: ${VERCEL_PROJECT:-ee292m-visualization}
      HOME: /tmp/home
    volumes:
      - type: bind
        source: ${HOME}/Library/Application Support/com.vercel.cli
        target: /auth
        read_only: true
      - type: bind
        source: ./push_secrets.sh
        target: /push_secrets.sh
        read_only: true
    entrypoint: ["sh", "/push_secrets.sh"]
